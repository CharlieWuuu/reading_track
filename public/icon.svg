<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    App icon：一本翻開的書。

    兩頁往中間收、書口那一側微微外拱，是書攤開時紙自然彎起來的樣子；
    畫成兩個對稱的直角矩形就只會像暫停鍵（前一版就是這個問題）。
    中間留一道縫當書脊，深藍是品牌主色，頁面用米白而不是純白，
    在淺色底的桌面上邊界才不會消失。
  -->
  <rect width="512" height="512" rx="112" fill="#2B5A8E" />
  <g fill="#FCF9F2">
    <path d="M248 168C210 132 156 116 96 120v272c60-4 114 12 152 48z" />
    <path d="M264 168c38-36 92-52 152-48v272c-60-4-114 12-152 48z" />
  </g>
</svg>
