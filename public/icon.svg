<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon：檔案夾的索引分隔片，重點是「歸檔」不是「讀」。圓角外側留透明 -->
  <rect width="512" height="512" rx="112" fill="#8a6d1b" />
  <!-- 後面那片只露出標籤，說明這裡不只一份 -->
  <rect x="272" y="128" width="128" height="80" rx="16" fill="#FCF9F2" opacity=".45" />
  <g fill="#FCF9F2">
    <!-- 前面這片：左上一個標籤，接著卡片本體 -->
    <rect x="112" y="152" width="128" height="80" rx="16" />
    <rect x="112" y="192" width="288" height="168" rx="16" />
  </g>
  <!-- 卡片上的兩行索引，用底色挖出來 -->
  <g fill="#8a6d1b">
    <rect x="152" y="248" width="208" height="16" rx="8" />
    <rect x="152" y="288" width="144" height="16" rx="8" />
  </g>
</svg>
