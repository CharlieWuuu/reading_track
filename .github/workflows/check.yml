name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Storybook 的測試跑在真的 chromium 裡，CI 上要自己裝
      - run: npx playwright install --with-deps chromium

      - run: npm run check:all
